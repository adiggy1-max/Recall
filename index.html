ganisation structures its content.", "category": "Communications", "aliases": ["content pillar", "pillars"], "hint": "Starts with C"}, {"id": "content-cadence", "target": "Content cadence", "prompt": "The planned frequency and rhythm with which content is published.", "category": "Communications", "aliases": ["cadence"], "hint": "Starts with C"}, {"id": "platform-native-content", "target": "Platform-native content", "prompt": "Content designed specifically for the conventions, formats and user behaviour of the platform where it appears.", "category": "Communications", "aliases": ["platform native", "native content"], "hint": "Starts with P"}, {"id": "reactive-content", "target": "Reactive content", "prompt": "Content produced in response to a current event, development or emerging conversation.", "category": "Communications", "aliases": ["reactive"], "hint": "Starts with R"}, {"id": "news-hook", "target": "News hook", "prompt": "The timely angle or development that makes a story relevant to journalists and audiences now.", "category": "Communications", "aliases": ["hook"], "hint": "Starts with N"}, {"id": "earned-media", "target": "Earned media", "prompt": "Publicity gained through independent editorial coverage rather than media space an organisation pays for.", "category": "Communications", "aliases": ["earned"], "hint": "Starts with E"}, {"id": "paid-media", "target": "Paid media", "prompt": "Media exposure obtained by paying for advertising, sponsorship or promoted distribution.", "category": "Communications", "aliases": ["paid"], "hint": "Starts with P"}, {"id": "conversion", "target": "Conversion", "prompt": "When an audience member completes the action a communication is intended to drive.", "category": "Communications", "aliases": ["conversions"], "hint": "Starts with C"}, {"id": "audience-journey", "target": "Audience journey", "prompt": "The stages an audience moves through from first awareness to deeper engagement or action.", "category": "Communications", "aliases": ["journey"], "hint": "Starts with A"}, {"id": "kpi", "target": "KPI", "prompt": "A measurable indicator used to assess progress toward an objective.", "category": "Communications", "aliases": ["key performance indicator", "key performance indicators", "KPIs"], "hint": "Starts with K"}, {"id": "ab-testing", "target": "A/B testing", "prompt": "Comparing two variants to see which performs better with an audience.", "category": "Communications", "aliases": ["AB testing", "split testing"], "hint": "Starts with A"}, {"id": "channel-optimisation", "target": "Channel optimisation", "prompt": "Adjusting how a communication channel is used to improve performance against objectives.", "category": "Communications", "aliases": ["channel optimization", "optimisation", "optimization"], "hint": "Starts with C"}, {"id": "reputational-risk", "target": "Reputational risk", "prompt": "The possibility that an event, decision or communication will damage how an organisation is perceived.", "category": "Communications", "aliases": ["reputation risk"], "hint": "Starts with R"}, {"id": "issues-management", "target": "Issues management", "prompt": "Identifying and managing emerging issues that could affect an organisation’s reputation or operating environment.", "category": "Communications", "aliases": ["issue management"], "hint": "Starts with I"}, {"id": "crisis-communications", "target": "Crisis communications", "prompt": "Strategic communication used to manage information, stakeholders and reputation during a serious disruptive event.", "category": "Communications", "aliases": ["crisis comms", "crisis communication"], "hint": "Starts with C"}, {"id": "sentiment", "target": "Sentiment", "prompt": "The overall positive, negative or neutral attitude expressed by an audience toward a subject.", "category": "Communications", "aliases": ["audience sentiment"], "hint": "Starts with S"}, {"id": "share-of-voice", "target": "Share of voice", "prompt": "The proportion of relevant public or media conversation accounted for by a brand, organisation or issue.", "category": "Communications", "aliases": ["SOV"], "hint": "Starts with S"}, {"id": "amplification", "target": "Amplification", "prompt": "Extending the reach or visibility of content through additional distribution, sharing or influential voices.", "category": "Communications", "aliases": ["amplify"], "hint": "Starts with A"}, {"id": "thought-leadership", "target": "Thought leadership", "prompt": "Content or commentary intended to establish an organisation or person as an authoritative voice in a field.", "category": "Communications", "aliases": ["thought leader"], "hint": "Starts with T"}, {"id": "milestone-driven-campaign", "target": "Milestone-driven campaign", "prompt": "A campaign structured around significant dates, events or stages that create moments for communication and action.", "category": "Communications", "aliases": ["milestone driven campaign"], "hint": "Starts with M"}, {"id": "campaign-baseline", "target": "Campaign baseline", "prompt": "The starting measurement used to judge how much change a campaign produces.", "category": "Communications", "aliases": ["baseline"], "hint": "Starts with C"}, {"id": "reach", "target": "Reach", "prompt": "The number of unique people who are exposed to a piece of content or campaign.", "category": "Communications", "aliases": [], "hint": "Starts with R"}, {"id": "engagement", "target": "Engagement", "prompt": "Audience interaction with content, such as clicks, comments, shares or other active responses.", "category": "Communications", "aliases": [], "hint": "Starts with E"}, {"id": "cta", "target": "Call to action", "prompt": "A clear instruction telling an audience what action to take next.", "category": "Communications", "aliases": ["CTA", "call-to-action"], "hint": "Starts with C"}, {"id": "ctr", "target": "Click-through rate", "prompt": "The percentage of people exposed to a link or advert who click it.", "category": "Communications", "aliases": ["CTR", "click through rate"], "hint": "Starts with C"}, {"id": "reduce-cognitive-load", "target": "Reduce cognitive load", "prompt": "Make information easier to process by reducing unnecessary mental effort or complexity.", "category": "Communications", "aliases": ["cognitive load", "reducing cognitive load"], "hint": "Starts with R"}, {"id": "information-environment", "target": "Information environment", "prompt": "The wider system of sources, platforms, actors and conditions through which people encounter and interpret information.", "category": "Information environment", "aliases": [], "hint": "Starts with I"}, {"id": "fragmented-information-environment", "target": "Fragmented information environment", "prompt": "An information landscape split across many sources, platforms and communities with fewer shared points of reference.", "category": "Information environment", "aliases": ["fragmented information", "information fragmentation"], "hint": "Starts with F"}, {"id": "media-as-mediator", "target": "Media as mediator", "prompt": "The role of established media between politicians and the public, selecting, interpreting and contextualising information.", "category": "Information environment", "aliases": ["media mediator", "media as a mediator"], "hint": "Starts with M"}, {"id": "gatekeepers", "target": "Gatekeepers", "prompt": "Actors or institutions that control which information gains access to an audience or public agenda.", "category": "Information environment", "aliases": ["gatekeeper"], "hint": "Starts with G"}, {"id": "attention-incentives", "target": "Attention incentives", "prompt": "Pressures that reward content for capturing attention, sometimes regardless of its informational quality.", "category": "Information environment", "aliases": ["attention incentive"], "hint": "Starts with A"}, {"id": "platformisation", "target": "Platformisation", "prompt": "The growing organisation of communication, markets or social activity around digital platform infrastructures and their rules.", "category": "Information environment", "aliases": ["platformization"], "hint": "Starts with P"}, {"id": "attention-economy", "target": "Attention economy", "prompt": "A system in which human attention is scarce and organisations compete to capture and monetise it.", "category": "Information environment", "aliases": [], "hint": "Starts with A"}, {"id": "misinformation", "target": "Misinformation", "prompt": "False or inaccurate information shared without necessarily intending to deceive.", "category": "Information environment", "aliases": [], "hint": "Starts with M"}, {"id": "shared-factual-baseline", "target": "Shared factual baseline", "prompt": "A common body of basic facts that participants broadly accept as a starting point for debate.", "category": "Information environment", "aliases": ["factual baseline", "shared facts"], "hint": "Starts with S"}, {"id": "disintermediation", "target": "Disintermediation", "prompt": "Political actors communicating directly with audiences through digital platforms, bypassing traditional media gatekeepers.", "category": "Information environment", "aliases": [], "hint": "Starts with D"}, {"id": "authenticity", "target": "Authenticity", "prompt": "The perception that a communicator is genuine, credible and consistent with who they claim to be.", "category": "Information environment", "aliases": ["authentic"], "hint": "Starts with A"}, {"id": "post-war-consensus", "target": "Post-war consensus", "prompt": "The broad post-1945 political agreement in Britain around a mixed economy, welfare provision and a significant state role.", "category": "Political economy", "aliases": ["postwar consensus"], "hint": "Starts with P"}, {"id": "welfare-state", "target": "Welfare state", "prompt": "A system in which the state provides social protection and public services to support citizens’ welfare.", "category": "Political economy", "aliases": [], "hint": "Starts with W"}, {"id": "social-protection", "target": "Social protection", "prompt": "Policies and programmes that protect people against poverty, income loss and social or economic risks.", "category": "Political economy", "aliases": [], "hint": "Starts with S"}, {"id": "redistribution", "target": "Redistribution", "prompt": "The use of taxes, transfers or public spending to alter the distribution of income or wealth.", "category": "Political economy", "aliases": [], "hint": "Starts with R"}, {"id": "collective-bargaining", "target": "Collective bargaining", "prompt": "Negotiation between workers, usually represented by unions, and employers over pay and working conditions.", "category": "Political economy", "aliases": [], "hint": "Starts with C"}, {"id": "organised-labour", "target": "Organised labour", "prompt": "Workers acting collectively through trade unions and related institutions.", "category": "Political economy", "aliases": ["organized labour", "organized labor", "organised labor"], "hint": "Starts with O"}, {"id": "full-employment-policy", "target": "Full-employment policy", "prompt": "Economic policy aimed at maintaining employment at or close to the highest sustainable level.", "category": "Political economy", "aliases": ["full employment"], "hint": "Starts with F"}, {"id": "deindustrialisation", "target": "Deindustrialisation", "prompt": "A long-term decline in the relative importance of manufacturing and industrial employment in an economy.", "category": "Political economy", "aliases": ["deindustrialization"], "hint": "Starts with D"}, {"id": "offshoring", "target": "Offshoring", "prompt": "Moving business activities, production or services from one country to another.", "category": "Political economy", "aliases": [], "hint": "Starts with O"}, {"id": "financialisation", "target": "Financialisation", "prompt": "The growing role and influence of financial markets, institutions and motives within the economy.", "category": "Political economy", "aliases": ["financialization"], "hint": "Starts with F"}, {"id": "deregulation", "target": "Deregulation", "prompt": "The removal or reduction of government rules governing economic activity.", "category": "Political economy", "aliases": [], "hint": "Starts with D"}, {"id": "privatisation", "target": "Privatisation", "prompt": "The transfer of an enterprise, service or asset from public to private ownership or control.", "category": "Political economy", "aliases": ["privatization"], "hint": "Starts with P"}, {"id": "wage-stagnation", "target": "Wage stagnation", "prompt": "A prolonged period in which workers’ wages grow very slowly or fail to rise in real terms.", "category": "Political economy", "aliases": ["stagnant wages"], "hint": "Starts with W"}, {"id": "income-inequality", "target": "Income inequality", "prompt": "Unequal distribution of income across individuals or households.", "category": "Political economy", "aliases": [], "hint": "Starts with I"}, {"id": "wealth-inequality", "target": "Wealth inequality", "prompt": "Unequal distribution of accumulated assets and wealth across individuals or households.", "category": "Political economy", "aliases": [], "hint": "Starts with W"}, {"id": "demographic-ageing", "target": "Demographic ageing", "prompt": "A rise in the share of older people in a population, usually driven by longer lives and lower birth rates.", "category": "Political economy", "aliases": ["demographic aging", "ageing population", "aging population"], "hint": "Starts with D"}, {"id": "clarity", "target": "Clarity", "prompt": "A management principle focused on making expectations, purpose, responsibilities and definitions of success explicit.", "category": "Management & BPF", "aliases": [], "hint": "Starts with C"}, {"id": "transparency", "target": "Transparency", "prompt": "A management principle focused on communicating decisions, priorities and relevant information openly.", "category": "Management & BPF", "aliases": [], "hint": "Starts with T"}, {"id": "consistency", "target": "Consistency", "prompt": "A management principle focused on applying expectations, decisions and ways of working reliably over time.", "category": "Management & BPF", "aliases": [], "hint": "Starts with C"}];
const STORE='recall-v2';
let data=load();let session=null;let recognition=null;
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{let d=JSON.parse(localStorage.getItem(STORE));if(d&&d.terms)return d}catch(e){}return {terms:clone(DEFAULT_TERMS).map(x=>({...x,enabled:true,custom:false})),stats:{}}}function save(){localStorage.setItem(STORE,JSON.stringify(data))}
const app=document.querySelector('#app'),homeBtn=document.querySelector('#homeBtn');homeBtn.onclick=home;
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function home(){stopRec();session=null;homeBtn.classList.add('hidden');let cats=[...new Set(data.terms.filter(t=>t.enabled).map(t=>t.category))];app.innerHTML=`<div class="card home"><span class="pill">Verbal retrieval trainer</span><h1>Find the term,<br>not just the idea.</h1><p class="muted">Say the specialist term aloud. Correct answers advance automatically; weaker terms come back more often.</p><label>Practice set</label><select id="cat"><option>Everything</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="actions"><button class="btn" id="start">Start practice</button><button class="btn secondary" id="weak">Practice weak terms</button><button class="btn ghost" id="manage">Manage terms</button></div></div>`;document.querySelector('#start').onclick=()=>start(document.querySelector('#cat').value,false);document.querySelector('#weak').onclick=()=>start('Everything',true);document.querySelector('#manage').onclick=manage}
function stat(id){return data.stats[id]||{instant:0,correct:0,prompted:0,missed:0,last:0}}
function weakness(t){let s=stat(t.id);return Math.max(.5,1+s.missed*2+s.prompted-.45*s.instant-.2*s.correct)}
function start(cat,weak){let pool=data.terms.filter(t=>t.enabled&&(cat==='Everything'||t.category===cat));if(weak){let seen=pool.filter(t=>data.stats[t.id]);if(seen.length) pool=seen.sort((a,b)=>weakness(b)-weakness(a)).slice(0,Math.max(8,Math.ceil(seen.length*.5)))}if(!pool.length)return alert('No enabled terms in this set.');session={pool,queue:[],index:0,total:20,results:[],hinted:false,started:0,current:null};homeBtn.classList.remove('hidden');next()}
function choose(){let recent=session.results.slice(-4).map(r=>r.id),choices=session.pool.filter(t=>!recent.includes(t.id));if(!choices.length)choices=session.pool;let weights=choices.map(weakness),sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum;for(let i=0;i<choices.length;i++){r-=weights[i];if(r<=0)return choices[i]}return choices[0]}
function next(){stopRec();if(session.index>=session.total)return summary();session.current=choose();session.hinted=false;session.started=Date.now();renderCard()}
function renderCard(){let t=session.current;app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><span class="pill">${esc(t.category)}</span><span class="muted small">${session.index+1} / ${session.total}</span></div><div class="progress"><div style="width:${session.index/session.total*100}%"></div></div><div class="prompt">${esc(t.prompt)}</div><div class="center"><button class="mic" id="mic" aria-label="Speak answer">🎙</button><div class="transcript" id="tr">Tap the microphone and say the term</div><div class="feedback" id="fb"></div><div class="answer" id="ans"></div></div><label class="small">Or type your answer</label><input id="typed" placeholder="Type and press Enter"><div class="actions"><button class="btn secondary" id="hint">Hint</button><button class="btn ghost" id="reveal">Reveal</button><button class="btn ghost" id="skip">Skip</button></div></div>`;document.querySelector('#mic').onclick=listen;document.querySelector('#typed').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())evaluate(e.target.value)};document.querySelector('#hint').onclick=()=>{session.hinted=true;document.querySelector('#ans').textContent=t.hint||'Think of the specialist label, not the explanation.'};document.querySelector('#reveal').onclick=()=>miss(true);document.querySelector('#skip').onclick=()=>miss(false);if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){document.querySelector('#mic').disabled=true;document.querySelector('#tr').textContent='Speech recognition is not supported here — type instead.'}}
function listen(){stopRec();let SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='en-GB';recognition.interimResults=true;recognition.continuous=false;let finalText='';let mic=document.querySelector('#mic'),tr=document.querySelector('#tr');mic.classList.add('listening');tr.textContent='Listening…';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){let tx=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=tx;else interim+=tx}tr.textContent=finalText||interim;if(finalText.trim()){recognition.stop();setTimeout(()=>evaluate(finalText),100)}};recognition.onerror=e=>{mic?.classList.remove('listening');tr.textContent=e.error==='not-allowed'?'Microphone permission is blocked. You can type instead.':'I didn’t catch that. Tap the microphone and try again.'};recognition.onend=()=>mic?.classList.remove('listening');recognition.start()}
function stopRec(){try{recognition?.abort()}catch(e){}recognition=null}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9\s]/g,' ').replace(/\b(the|a|an|uh|um|erm|i think|it is|its|that's|that is|maybe|probably)\b/g,' ').replace(/\s+/g,' ').trim()}
function stem(w){return w.replace(/(isation|ization)$/,'ize').replace(/(ising|izing)$/,'ize').replace(/(ies)$/,'y').replace(/(s)$/,'')}
const STOP=new Set(['and','of','to','in','for','with','on','as']);function toks(s){return norm(s).split(' ').filter(Boolean).filter(x=>!STOP.has(x)).map(stem)}
function levenshtein(a,b){let m=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=m[0];m[0]=i;for(let j=1;j<=b.length;j++){let tmp=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp}}return m[b.length]}
function scoreAnswer(input,t){let candidates=[t.target,...(t.aliases||[])].map(norm),n=norm(input);if(candidates.includes(n))return {ok:true,kind:'exact'};let it=toks(n);for(let c of candidates){let ct=toks(c);if(!ct.length)continue;let overlap=ct.filter(x=>it.includes(x)).length;let coverage=overlap/ct.length;let precision=overlap/Math.max(it.length,1);if(ct.length>=2&&coverage>=.66&&precision>=.5)return {ok:true,kind:'flex'};if(ct.length===1&&it.some(x=>x===ct[0]||levenshtein(x,ct[0])<=Math.max(1,Math.floor(ct[0].length*.18))))return {ok:true,kind:'flex'};let joined=ct.join(' '),ij=it.join(' ');if(joined.length>5&&levenshtein(joined,ij)/Math.max(joined.length,ij.length)<.2)return {ok:true,kind:'flex'}}return {ok:false}}
function evaluate(input){if(!session?.current)return;stopRec();let t=session.current,res=scoreAnswer(input,t),fb=document.querySelector('#fb'),tr=document.querySelector('#tr');tr.textContent=input;if(res.ok){let sec=(Date.now()-session.started)/1000,kind=session.hinted?'prompted':sec<5?'instant':'correct';fb.className='feedback good';fb.textContent=kind==='instant'?'✓ Instant':'✓ Correct';record(t,kind,sec);setTimeout(()=>{session.index++;next()},650)}else{fb.className='feedback near';fb.textContent='Not quite — try again';document.querySelector('#ans').textContent='You can retry, use a hint, or reveal the answer.';document.querySelector('#typed').value=''}}
function miss(reveal){let t=session.current,fb=document.querySelector('#fb');fb.className='feedback bad';fb.textContent=reveal?'Answer revealed':'Skipped';document.querySelector('#ans').innerHTML=`<strong>${esc(t.target)}</strong>`;record(t,'missed',(Date.now()-session.started)/1000);setTimeout(()=>{session.index++;next()},reveal?1800:800)}
function record(t,kind,sec){let s=stat(t.id);s[kind]=(s[kind]||0)+1;s.last=Date.now();s.lastSeconds=Math.round(sec*10)/10;data.stats[t.id]=s;save();session.results.push({id:t.id,kind})}
function summary(){let counts={instant:0,correct:0,prompted:0,missed:0};session.results.forEach(r=>counts[r.kind]++);app.innerHTML=`<div class="card"><span class="pill">Session complete</span><h1>Nice work.</h1><div class="stats">${Object.entries(counts).map(([k,v])=>`<div class="stat"><b>${v}</b>${k[0].toUpperCase()+k.slice(1)}</div>`).join('')}</div><p class="muted">Missed and prompted terms will be weighted more heavily next time.</p><div class="actions"><button class="btn" id="again">Practice again</button><button class="btn secondary" id="weak2">Weak terms</button></div></div>`;document.querySelector('#again').onclick=()=>start('Everything',false);document.querySelector('#weak2').onclick=()=>start('Everything',true)}
function manage(){homeBtn.classList.remove('hidden');app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><span class="pill">Vocabulary</span><h2>Manage terms</h2></div><button class="btn" id="add">+ Add term</button></div><input id="search" placeholder="Search terms or prompts"><div id="terms"></div><div class="actions"><button class="btn ghost" id="restore">Restore default terms</button></div></div>`;document.querySelector('#search').oninput=renderTerms;document.querySelector('#add').onclick=()=>editTerm();document.querySelector('#restore').onclick=()=>{if(confirm('Restore the default vocabulary? Your performance history will be kept where term IDs still match.')){data.terms=clone(DEFAULT_TERMS).map(x=>({...x,enabled:true,custom:false}));save();renderTerms()}};renderTerms()}
function renderTerms(){let q=norm(document.querySelector('#search')?.value||''),box=document.querySelector('#terms');let arr=data.terms.filter(t=>!q||norm(t.target+' '+t.prompt+' '+t.category).includes(q));box.innerHTML=arr.map(t=>`<div class="termrow"><div><strong>${esc(t.target)}</strong><span class="muted small">${esc(t.category)} · ${t.enabled?'Enabled':'Disabled'}</span><div class="small">${esc(t.prompt)}</div></div><div><button class="btn ghost" data-edit="${esc(t.id)}">Edit</button></div></div>`).join('')||'<p class="muted">No matching terms.</p>';box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTerm(b.dataset.edit))}
function editTerm(id){let old=id?data.terms.find(t=>t.id===id):null,t=old?clone(old):{id:'user-'+Date.now(),target:'',prompt:'',category:'Communications',aliases:[],hint:'',enabled:true,custom:true};let cats=[...new Set(data.terms.map(x=>x.category))];let modal=document.querySelector('#modal'),mb=document.querySelector('#modalbox');mb.innerHTML=`<h2>${old?'Edit term':'Add term'}</h2><label>Target term</label><input id="eTarget" value="${esc(t.target)}"><label>Retrieval prompt</label><textarea id="ePrompt" rows="4">${esc(t.prompt)}</textarea><label>Category</label><input id="eCat" list="cats" value="${esc(t.category)}"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label>Accepted aliases <span class="muted">(comma separated)</span></label><input id="eAliases" value="${esc((t.aliases||[]).join(', '))}"><label>Hint</label><input id="eHint" value="${esc(t.hint||'')}"><label><input style="width:auto" type="checkbox" id="eEnabled" ${t.enabled?'checked':''}> Enabled in practice</label><div class="actions"><button class="btn" id="saveTerm">Save</button><button class="btn ghost" id="cancel">Cancel</button>${old?'<button class="btn ghost" id="delete">Delete</button>':''}</div>`;modal.classList.remove('hidden');document.querySelector('#cancel').onclick=()=>modal.classList.add('hidden');document.querySelector('#saveTerm').onclick=()=>{let target=document.querySelector('#eTarget').value.trim(),prompt=document.querySelector('#ePrompt').value.trim();if(!target||!prompt)return alert('Target and prompt are required.');Object.assign(t,{target,prompt,category:document.querySelector('#eCat').value.trim()||'Other',aliases:document.querySelector('#eAliases').value.split(',').map(x=>x.trim()).filter(Boolean),hint:document.querySelector('#eHint').value.trim(),enabled:document.querySelector('#eEnabled').checked});if(old)Object.assign(old,t);else data.terms.push(t);save();modal.classList.add('hidden');renderTerms()};if(old)document.querySelector('#delete').onclick=()=>{if(confirm('Delete this term?')){data.terms=data.terms.filter(x=>x.id!==id);save();modal.classList.add('hidden');renderTerms()}}}
modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')};home();
</script></body></html>
